name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install latest npm for trusted publishing
        run: npm install --global npm@latest

      - name: Verify trusted publishing prerequisites
        run: |
          node --version
          npm --version
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) exit 1 }'

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PACKAGE_VERSION}" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version v${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Quality gate
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish with npm Trusted Publishing
        run: npm publish --access public
