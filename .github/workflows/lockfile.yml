name: Prepare release files

on:
  workflow_dispatch:
  push:
    branches: [chore/release-green]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/lockfile.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/release-green
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run format:fix
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json README.md src tests examples docs skills .github
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: apply reproducible release formatting"
          git push
