name: Prepare release files

on:
  workflow_dispatch:
  push:
    branches: [chore/release-green]
    paths:
      - package.json
      - .github/workflows/lockfile.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run format:fix
      - uses: actions/upload-artifact@v6
        with:
          name: release-prep
          path: |
            package-lock.json
            package.json
            README.md
            src
            tests
            examples
            docs
            skills
            .github
          if-no-files-found: error
