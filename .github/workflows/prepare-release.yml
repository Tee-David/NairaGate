name: Prepare release dependency state

on:
  push:
    branches: [chore/release-green]
    paths:
      - package.json
      - .github/workflows/prepare-release.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/release-green
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run format:fix
      - name: Commit dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json src tsconfig.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh TypeScript 6 dependency state"
          git push
