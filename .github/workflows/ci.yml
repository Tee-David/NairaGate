name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Diagnostic quality gate
        run: |
          npm run format:fix
          git diff --no-ext-diff
          npm run lint
          npm run typecheck
          npm run test
          npm run build
